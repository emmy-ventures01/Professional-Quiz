<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup - Professional Quiz</title>
<style>
body { font-family:'Helvetica Neue',Arial,sans-serif; background:#fff; color:#000; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:0;}
.container { max-width:500px; width:100%; padding:30px; border:2px solid #000; border-radius:12px; }
h1 { text-align:center; margin-bottom:25px; }
label { display:block; margin-top:15px; margin-bottom:5px; font-weight:600; }
input { width:100%; padding:12px; border:1px solid #000; border-radius:8px; font-size:1em; }
button { margin-top:25px; width:100%; padding:12px; border-radius:8px; border:2px solid #000; background:#000; color:#fff; font-weight:600; cursor:pointer; transition:all 0.3s; }
button:hover { background:#fff; color:#000; }
</style>
</head>
<body>
<div class="container">
  <h1>Signup to Start Quiz</h1>
  <form id="signupForm" action="https://formspree.io/f/mbdrrgvy" method="POST">
    <label for="name">Full Name:</label>
    <input type="text" name="name" id="name" required>

    <label for="age">Age:</label>
    <input type="number" name="age" id="age" required>

    <label for="experience">Computer Experience:</label>
    <input type="text" name="experience" id="experience" placeholder="e.g., Beginner, Intermediate, Advanced" required>

    <label for="email">Email:</label>
    <input type="email" name="email" id="email" required>

    <button type="submit">Start Quiz</button>
  </form>
</div>

<script>
const form = document.getElementById('signupForm');

form.addEventListener('submit', function(e){
  e.preventDefault(); // prevent default Formspree page
  const formData = new FormData(form);

  fetch(form.action, {
    method: 'POST',
    body: formData,
    headers: { 'Accept': 'application/json' }
  }).then(response => {
    // redirect to quiz page
    window.location.href = "quiz.html";
  }).catch(error => {
    alert("There was a problem submitting the form. Please try again.");
  });
});
</script>
</body>
</html>
