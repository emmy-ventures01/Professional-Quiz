<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - Professional Quiz Platform</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #fff;
      color: #000;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background: #fff;
      padding: 20px;
      border-bottom: 1px solid #000;
    }

    header img {
      height: 80px;
      width: auto;
      margin-bottom: 10px;
    }

    .container {
      max-width: 500px;
      margin: 50px auto;
      padding: 30px 20px;
      background: #f9f9f9;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      text-align: left;
    }

    h2 {
      font-size: 2em;
      margin-bottom: 25px;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #000;
      font-size: 1em;
    }

    button {
      padding: 15px;
      width: 100%;
      font-size: 1.1em;
      border-radius: 8px;
      border: 2px solid #000;
      background: #000;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #fff;
      color: #000;
    }

    @media (max-width: 500px) {
      .container { padding: 25px 15px; }
      h2 { font-size: 1.6em; }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://uxwing.com/wp-content/themes/uxwing/download/quiz-icon.png" alt="Quiz Platform Logo">
  </header>

  <div class="container">
    <h2>Sign Up</h2>
    <form action="https://formspree.io/f/mbdrrgvy" method="POST">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Your full name" required>

      <label for="age">Age</label>
      <input type="number" id="age" name="age" placeholder="Your age" min="5" max="120" required>

      <label for="experience">Computer Literacy Experience</label>
      <select id="experience" name="experience" required>
        <option value="" disabled selected>Select your experience</option>
        <option value="Beginner">Beginner</option>
        <option value="Intermediate">Intermediate</option>
        <option value="Advanced">Advanced</option>
      </select>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
